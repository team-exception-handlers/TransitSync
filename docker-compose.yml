# AI contribution: Below 50% AI-generated
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TRANSITSYNC_CORS_ORIGINS: ${TRANSITSYNC_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      # nginx runs as a non-root user, so it listens on 8080 instead of 80.
      - "5173:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

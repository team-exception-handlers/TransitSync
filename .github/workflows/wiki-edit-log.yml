# AI contribution: 50% or more AI-generated
# wiki edit log
# github wikis have no review step or per-page locks, so this workflow gives us
# the next best thing: a public record. every time someone creates or edits a
# wiki page, it posts who did it and links to that exact revision on one
# "Wiki edit log" issue. anyone watching the issue gets notified.

name: Wiki edit log

on:
  # "gollum" is github's name for the wiki engine, so this fires on any wiki edit
  gollum:

# the job only needs to read the repo and write issue comments, nothing else
permissions:
  contents: read
  issues: write

jobs:
  log-edit:
    runs-on: ubuntu-latest
    steps:
      - name: Post the edit to the Wiki edit log issue
        uses: actions/github-script@v7
        with:
          script: |
            // the issue title we look for (and create the first time)
            const TITLE = 'Wiki edit log';
            const { owner, repo } = context.repo;

            // look for an open issue with that exact title
            const found = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            let issue = found.find((i) => !i.pull_request && i.title === TITLE);

            // first run: make the issue so every later edit has a home
            if (!issue) {
              const created = await github.rest.issues.create({
                owner, repo, title: TITLE,
                body: 'Every wiki create or edit is posted here automatically by `.github/workflows/wiki-edit-log.yml`. Subscribe to get notified.',
              });
              issue = created.data;
            }

            // one line per page touched in this push, each linking to the
            // exact revision and to the page's full history
            const editor = context.payload.sender.login;
            const lines = context.payload.pages.map((p) =>
              `- **${p.action}** [${p.title}](${p.html_url}): ` +
              `[this revision](${p.html_url}/${p.sha}) · [history](${p.html_url}/_history)`
            );

            // the comment body: who, when, and what changed
            const when = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `\`${editor}\` edited the wiki (${when}):\n\n${lines.join('\n')}`,
            });

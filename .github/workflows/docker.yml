name: Docker Compose CI

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "api/**"
      - "config/**"
      - "simulator/**"
      - "web/**"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "api/**"
      - "config/**"
      - "simulator/**"
      - "web/**"
      - ".github/workflows/docker.yml"

jobs:
  compose-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Check backend health endpoint
        run: |
          response="$(curl --fail --silent --show-error http://localhost:8000/health)"
          test "$response" = '{"status":"ok"}'

      - name: Check frontend response
        run: |
          page="$(curl --fail --silent --show-error http://localhost:5173)"
          grep -q '<div id="root">' <<< "$page"

      - name: Stop services
        if: always()
        run: docker compose down --volumes
